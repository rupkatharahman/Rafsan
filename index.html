<html>
    <body>
        <div>
            <br/>
            <br/>
            <br/>
            <br/>
            <br/>
            <br/>
            <h1>Will you be my valentine, Rafsan?</h1>
            <img id="valentineImage" src="" alt="Valentine's Day Image" style="max-width: 300px; height: auto;">
            <br/>
            <br/>
            <br/>
            <button id="yesButton">Yes</button>
            <button id="no">No</button>
        </div>

        <style>
            body {
                background: linear-gradient(to bottom, #FC6C85, #FBBBB9);
            }
            div {
                text-align: center;
                vertical-align: middle;
            }
            h1 {
                color: #CA226B;
            }
            #yesButton {
                background-color: #52D017;
                transition: transform 0.3s;
                margin-right: 10px;
                width: 120px;
                font-size: 30px;
                height: 40px;
                color: #fff;
                margin-left: -140px;
            }
            #no {
                position: absolute;
                background-color: #E41B17;
                transition: transform 0.3s;
                margin-left: 10px;
                width: 120px;
                height: 40px;
                color: #fff;
            }
        </style>
        <script>
            document.getElementById("yesButton").addEventListener("click", showAlert);

            function showAlert() {
                alert("I love you more baby! You're my Valentine everyday <3");
                document.getElementById("valentineImage").src = ""; // Add your Yes button image URL here
            }

            var yesButton = document.getElementById("yesButton");
            var no = document.getElementById("no");
            var valentineImage = document.getElementById("valentineImage");

            var noTexts = ["Rude baby :(", "Please give me a chance", "Please babeee", "Wow I did not expect this :(", "Wait, think about it please :(", "I'm gonna cry"];
            var noImage = ""; // Add your No button image URL here

            no.addEventListener("click", change);

            function change() {
                var randomIndex = Math.floor(Math.random() * noTexts.length);
                var randomText = noTexts[randomIndex];
                no.innerText = randomText;
                valentineImage.src = noImage; // Change to No button image

                var i = Math.floor(Math.random() * 1000) + 1;
                var j = Math.floor(Math.random() * 700) + 1;
                no.style.left = i + "px";
                no.style.top = j + "px";

                var currentWidth = yesButton.offsetWidth;
                var currentHeight = yesButton.offsetHeight;
                yesButton.style.width = currentWidth + 30 + "px";
                yesButton.style.height = currentHeight + 10 + "px";
            }
        </script>
    </body>
</html>
